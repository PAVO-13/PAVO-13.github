<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:40px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#2c3e50;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#333;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

textarea{
    resize:vertical;
}

button{
    width:100%;
    padding:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}
</style>
</head>

<body>

<div class="container">

<h1>CV / Resume Form</h1>

<form>

<div class="form-group">
<label>Full Name</label>
<input type="text" placeholder="Enter your full name">
</div>

<div class="form-group">
<label>Email</label>
<input type="email" placeholder="Enter your email">
</div>

<div class="form-group">
<label>Phone Number</label>
<input type="tel" placeholder="Enter your phone number">
</div>

<div class="form-group">
<label>Address</label>
<input type="text" placeholder="Enter your address">
</div>

<div class="form-group">
<label>Career Objective</label>
<textarea rows="4" placeholder="Write your career objective"></textarea>
</div>

<div class="form-group">
<label>Education</label>
<textarea rows="4" placeholder="School, College, University"></textarea>
</div>

<div class="form-group">
<label>Skills</label>
<textarea rows="4" placeholder="Java, HTML, CSS, JavaScript, Teamwork"></textarea>
</div>

<div class="form-group">
<label>Projects</label>
<textarea rows="4" placeholder="Java Card Game, Portfolio Website"></textarea>
</div>

<div class="form-group">
<label>Languages</label>
<input type="text" placeholder="English, Japanese, Burmese">
</div>

<div class="form-group">
<label>Graduation Year</label>
<input type="number" placeholder="2027">
</div>

<button type="submit">Submit CV</button>

</form>

</div>

</body>
</html>
